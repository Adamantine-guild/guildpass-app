# =============================================================================
# GuildPass CD — Deploys to production on push to main
# =============================================================================
name: CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "logo/**"
      - "*.md"

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  DASHBOARD_IMAGE: ghcr.io/${{ github.repository }}/dashboard
  ACCESS_API_IMAGE: ghcr.io/${{ github.repository }}/access-api
  DISCORD_BOT_IMAGE: ghcr.io/${{ github.repository }}/discord-bot

jobs:
  # ── Run CI checks first ─────────────────────────────────────────────
  ci-checks:
    name: CI Checks
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # ── Build & Push Docker Images ──────────────────────────────────────
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [ci-checks]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels) for dashboard
        id: meta-dashboard
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DASHBOARD_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push dashboard
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/dashboard/Dockerfile
          push: true
          tags: ${{ steps.meta-dashboard.outputs.tags }}
          labels: ${{ steps.meta-dashboard.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for access-api
        id: meta-access-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ACCESS_API_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push access-api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/access-api/Dockerfile
          push: true
          tags: ${{ steps.meta-access-api.outputs.tags }}
          labels: ${{ steps.meta-access-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for discord-bot
        id: meta-discord-bot
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DISCORD_BOT_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push discord-bot
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/discord-bot/Dockerfile
          push: true
          tags: ${{ steps.meta-discord-bot.outputs.tags }}
          labels: ${{ steps.meta-discord-bot.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy (placeholder — adapt to your infrastructure) ─────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [build-and-push]
    timeout-minutes: 15
    environment: production
    if: false
    steps:
      - run: |
          echo "Deploy step is disabled."
          echo "Enable by removing 'if: false' and adding your deployment logic."